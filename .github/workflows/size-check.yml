name: CSS Size Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check-size:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Build CSS
      run: |
        python3 build.py
    
    # Los límites se miden en gzip (gzip -9): es lo que realmente se transfiere al navegador.
    # El tamaño sin comprimir solo se informa. Límites con ~20 % de margen sobre la v1.5.0
    # (kardocss.css ~25 KB gzip, kardocss.min.css ~21 KB gzip).
    - name: Check CSS size (gzip)
      run: |
        check() {
          FILE="$1"; MAX_KB="$2"
          RAW=$(wc -c < "$FILE" | tr -d ' ')
          GZ=$(gzip -9 -c "$FILE" | wc -c | tr -d ' ')
          MAX=$((MAX_KB * 1024))
          echo "📊 $FILE: $((GZ / 1024)) KB gzip (${GZ} bytes) · $((RAW / 1024)) KB sin comprimir"
          echo "📏 Límite: ${MAX_KB} KB gzip"
          if [ "$GZ" -gt "$MAX" ]; then
            echo "❌ $FILE supera el límite gzip en $(((GZ - MAX) / 1024)) KB"
            return 1
          fi
          echo "✅ Dentro del límite (disponibles: $(((MAX - GZ) / 1024)) KB)"
        }
        STATUS=0
        check dist/kardocss.css 30 || STATUS=1
        check dist/kardocss.min.css 26 || STATUS=1
        exit $STATUS
    
    - name: Size Report
      if: always()
      run: |
        row() {
          FILE="$1"; MAX_KB="$2"
          RAW=$(wc -c < "$FILE" | tr -d ' ')
          GZ=$(gzip -9 -c "$FILE" | wc -c | tr -d ' ')
          STATUS="✅"
          if [ "$GZ" -gt $((MAX_KB * 1024)) ]; then STATUS="❌"; fi
          echo "| $(basename "$FILE") | $((RAW / 1024)) KB | $((GZ / 1024)) KB | ${MAX_KB} KB | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
        }
        echo "## 📦 CSS Size Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Archivo | Sin comprimir | Gzip | Límite (gzip) | Estado |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|---------------|------|---------------|--------|" >> $GITHUB_STEP_SUMMARY
        row dist/kardocss.css 30
        row dist/kardocss.min.css 26
